name: Train illustrative radio model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['radio/train.py', '.github/workflows/train-radio.yml']
permissions:
  contents: write
concurrency:
  group: greenhouse-repository-updates
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Train on synthetic channel assumptions
        run: python radio/train.py
      - uses: actions/upload-artifact@v4
        with:
          name: greenhouse-radio-model
          path: |
            public/radio-model.json
            models/radio_metrics.json
            models/radio_link.pt
      - name: Publish trained radio model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/radio-model.json models/radio_metrics.json models/radio_link.pt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish trained illustrative radio model'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
